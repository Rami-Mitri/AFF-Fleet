<head>
<meta charset="utf-8">

<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0d1524;--tx:#e8f4ff;--mut:#8ba4bf;--br:#1d3553;--pri:#00c8ff;--side:#050914;--ok:#00e58b;--wa:#ffad33;--er:#ff496c;--sh:0 4px 22px #00bfff12;--glow:0 0 0 1px #00c8ff18,0 0 18px #00c8ff0b}
/* Cyber Track theme */
:root{--cyber-accent:#00c8ff}

*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
body:has(.lg){background:radial-gradient(ellipse at top right,#102b49 0%,#070b14 58%,#03050a 100%)}
.shell{display:flex;min-height:100vh}.content{flex:1;min-width:0}
aside{width:230px;background:var(--side);color:#cfe0f3;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;z-index:1000}
.brand{font-size:20px;font-weight:700;color:#fff;padding:6px 10px 18px}.brand small{display:block;font-size:12px;font-weight:400;color:#7f93ad;margin-top:2px}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
aside nav button{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;color:#b9cbe0;padding:10px 12px;border-radius:10px;width:100%}
aside nav button:hover{background:color-mix(in srgb,var(--pri) 8%,transparent);color:#e8faff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 13%,transparent)}aside nav button.on{background:linear-gradient(100deg,var(--pri2),var(--pri));color:var(--onpri);font-weight:700;box-shadow:0 0 18px color-mix(in srgb,var(--pri) 15%,transparent)}
.usr{border-top:1px solid #ffffff1a;padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}.usr button{background:#ffffff14;color:#fff;border:0}
main{padding:24px;max-width:1100px;margin:auto}h2{margin:0 0 14px;font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{padding:8px 14px;border:1px solid var(--br);background:var(--card);border-radius:10px;cursor:pointer}
button.p{background:linear-gradient(110deg,var(--pri2),var(--pri));color:var(--onpri);border-color:var(--pri);font-weight:700;box-shadow:0 0 14px color-mix(in srgb,var(--pri) 9%,transparent)}button.d{color:var(--er)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc,var(--pri));outline-offset:0;box-shadow:0 0 15px color-mix(in srgb,var(--pri) 9%,transparent)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.c{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--br);border-radius:16px;padding:16px;box-shadow:var(--sh),var(--glow)}
.g .c{border-top:4px solid var(--pri)}.g .c:nth-child(2){border-top-color:var(--ok)}.g .c:nth-child(3){border-top-color:var(--wa)}.g .c:nth-child(4){border-top-color:var(--er)}.g .c:nth-child(5){border-top-color:var(--sec)}
.c h3{margin:0 0 4px;font-size:30px}.c span{color:var(--mut);font-size:13px}
.w{overflow-x:auto;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--br);text-align:start;white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-size:12px}tr:hover td{background:color-mix(in srgb,var(--pri) 5%,transparent)}tr:last-child td{border-bottom:0}
.t{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;color:#fff}
#map,#rmap{position:relative;z-index:0;border-radius:16px;border:1px solid var(--br);box-shadow:var(--sh)}#map{height:70vh}
.m{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:2000;padding:12px}
.m form{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0006}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}.r{display:flex;gap:8px;margin-top:14px}
.n{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px;font-size:14px;box-shadow:var(--sh)}.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#06101d;color:#dff8ff;border:1px solid color-mix(in srgb,var(--pri) 33%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--pri) 9%,transparent);padding:10px 16px;border-radius:10px;z-index:3000;display:none}
.lg{max-width:440px;margin:10vh auto;padding:30px 26px;text-align:center}.lg-title{display:block;text-align:center;font-size:clamp(30px,5vw,40px);font-weight:800;line-height:1.2;letter-spacing:.4px;color:#fff;margin:0 auto 24px;text-shadow:0 0 22px color-mix(in srgb,var(--pri) 27%,transparent)}.lg h2{text-align:center}
.truck-picker{margin:14px 0;padding:12px;border:1px solid var(--br);border-radius:12px;background:#07101c}.truck-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:8px 0 12px}.truck-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--br);border-radius:10px;padding:8px;margin:0;cursor:pointer;color:var(--tx);background:#0b1523}.truck-choice:has(input:checked){border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:color-mix(in srgb,var(--pri) 7%,transparent)}.truck-choice input{width:auto;accent-color:var(--pri)}.truck-choice svg{width:66px;height:42px;display:block}.truck-colors{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0}.truck-color{display:flex;align-items:center;gap:5px;border:1px solid var(--br);padding:5px 8px;border-radius:20px;margin:0;cursor:pointer}.truck-color input{width:auto;accent-color:var(--pri)}.color-dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid #fff5}.truck-preview{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#0003;margin-top:8px}.truck-preview svg{width:76px;height:48px}.truck-cell svg{width:58px;height:36px;vertical-align:middle}.truck-cell{display:inline-flex;align-items:center;gap:6px}.aff-truck-div{background:transparent!important;border:0!important}.aff-truck-marker{width:48px;height:42px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #000c)}.aff-truck-marker svg{width:48px;height:42px;overflow:visible}.truck-button{padding:5px 8px;font-size:12px}
.company-pin{width:30px;height:30px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);background:#ef4444;border:2px solid #fff;box-shadow:0 2px 8px #000a;display:flex;align-items:center;justify-content:center;color:#fff}
.company-pin span{transform:rotate(45deg);font-size:15px;line-height:1}
.company-tooltip{background:#081523!important;color:#e8f4ff!important;border:1px solid var(--pri)!important;border-radius:7px!important;box-shadow:0 2px 8px #0008!important;font-weight:700;padding:4px 7px!important}
.company-tooltip:before{border-top-color:var(--pri)!important}
.company-pick-map{height:320px;border:1px solid var(--br);border-radius:12px;margin:8px 0;z-index:0}
.company-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.company-card{border:1px solid var(--br);border-radius:12px;padding:12px;background:#07111f;display:flex;flex-direction:column;gap:7px;min-width:0}
.company-card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.company-card .actions button{font-size:12px}
.plan-company-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.plan-company-option{display:flex;align-items:flex-start;gap:8px;background:#07111f;border:1px solid var(--br);border-radius:10px;padding:10px;margin:0;cursor:pointer}
.plan-company-option input{width:auto;margin-top:3px;accent-color:var(--pri);flex-shrink:0}
.plan-company-option span{display:block;min-width:0;white-space:normal}
.plan-company-option small{display:block;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.visit-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--br)}
.visit-row:last-child{border-bottom:0}.visit-row input{width:auto;margin-top:5px}
.visit-done{opacity:.62}.visit-done strong{text-decoration:line-through}
.driver-map{height:42vh;min-height:270px;border:1px solid var(--br);border-radius:14px;margin:12px 0;z-index:0}
.route-note{padding:10px 12px;border-inline-start:3px solid var(--pri);background:color-mix(in srgb,var(--pri) 5%,transparent);border-radius:8px;margin:10px 0}
@media(max-width:760px){.company-pick-map{height:260px}.driver-map{height:36vh;min-height:230px}}
@media(max-width:760px){.shell{display:block}aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px;border-top:1px solid #ffffff1a}
.brand,.usr span{display:none}aside nav{flex-direction:row;overflow-x:auto;gap:2px}aside nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;white-space:nowrap;width:auto}
.usr{border:0;padding:0;flex-direction:row}main{padding:14px 12px 96px}#map{height:60vh}#toast{bottom:84px}}

.trk-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:2px}
.trk-chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 13px;border-radius:99px;font-size:14px}
.trk-chip.on{background:linear-gradient(110deg,var(--pri2),var(--pri));color:var(--onpri);border-color:var(--pri);font-weight:700}
.trk-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #fff5}
.trk-info{min-height:22px;margin:0 0 10px;font-size:14px;color:var(--mut)}.trk-info b{color:var(--tx)}
.trk-tooltip{background:#062014!important;color:#dfffee!important;border:1px solid #00e58b!important;border-radius:7px!important;box-shadow:0 2px 8px #0008!important;font-weight:700;padding:3px 7px!important}
.trk-tooltip:before{border-top-color:#00e58b!important}.trk-tooltip.off{opacity:.65;border-color:#8ba4bf!important}
.r{flex-wrap:wrap}
.rpl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rpl input[type=range]{flex:1;min-width:150px;padding:0;accent-color:var(--pri)}.rpl select{width:auto}
.rpl-info{margin-top:8px;font-size:13px;color:var(--mut);min-height:20px}.rpl-info b{color:var(--tx)}
.warn{color:var(--wa)}
.vchip{padding:5px 0;border-bottom:1px dashed var(--br)}.vchip:last-child{border-bottom:0}
.mapfs{position:fixed!important;inset:0;width:100vw!important;height:100vh!important;height:100dvh!important;max-height:none!important;z-index:2500!important;border-radius:0!important;margin:0!important;border:0!important}
body.fs-on{overflow:hidden}
body.fs-live .trk-bar{position:fixed;top:8px;left:52px;right:8px;z-index:2600;background:#06101de6;border-radius:12px;padding:6px 8px;margin:0}
body.fs-live .trk-info{position:fixed;bottom:8px;left:8px;right:8px;z-index:2600;background:#06101de6;border-radius:10px;padding:8px 12px;margin:0}
body.fs-rep #rpl{position:fixed;bottom:8px;left:8px;right:8px;z-index:2600;margin:0;background:#06101df2}

.leaflet-container{direction:ltr}
.leaflet-bar a,.leaflet-control-layers,.leaflet-bar a:hover{background:var(--card)!important;color:var(--tx)!important;border-color:var(--br)!important}
[dir=ltr] input[type=email],[dir=ltr] input[type=number]{direction:ltr}
#lgsw{position:fixed;top:10px;inset-inline-end:12px;z-index:3000}#lgsw select{width:auto;padding:6px 10px}
.thg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.thb{display:flex;align-items:center;gap:8px;padding:8px 12px}
.thb.on{outline:2px solid var(--pri)}.thb i{display:inline-flex;width:34px;height:18px;border-radius:6px;overflow:hidden;border:1px solid var(--br)}.thb i b{flex:1}
.thc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.thc input[type=color]{height:40px;padding:2px}
.pvr label{display:flex;gap:8px;align-items:center;margin:6px 0}.pvr input[type=radio]{width:auto}
pre.cd{direction:ltr;text-align:left;overflow:auto;background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:10px;font-size:12px}
/* ===== [UPDATE] UI polish ===== */
:root{--rad:14px}
body{line-height:1.55;-webkit-font-smoothing:antialiased}
aside{width:250px;padding:20px 14px;border-inline-end:1px solid var(--br);background:linear-gradient(180deg,var(--side),color-mix(in srgb,var(--side) 88%,var(--pri)))}
.brand{display:flex;flex-direction:column;padding:4px 10px 18px;margin-bottom:6px;border-bottom:1px solid #ffffff14;letter-spacing:.3px}
.brand small{color:var(--pri);font-weight:600;letter-spacing:.5px}
aside nav{gap:2px;padding-inline-end:2px}
.ng{font-size:11px;font-weight:700;color:#7f93ad;letter-spacing:.6px;padding:14px 12px 6px;text-transform:uppercase}
aside nav button{position:relative;gap:12px;padding:9px 12px;border-radius:12px;font-weight:600;font-size:14px;transition:background .15s,color .15s}
aside nav button .ic{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#ffffff0d;font-size:15px;flex:none}
aside nav button .tx{flex:1;text-align:start}
aside nav button:hover{background:#ffffff0f;box-shadow:none}
aside nav button.on{background:color-mix(in srgb,var(--pri) 18%,transparent);color:#fff;box-shadow:none}
aside nav button.on .ic{background:var(--pri);color:var(--onpri)}
aside nav button.on::before{content:"";position:absolute;inset-inline-start:-14px;top:20%;bottom:20%;width:4px;border-radius:4px;background:var(--pri)}
.bd{font-style:normal;background:var(--er);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.usr{border-top:1px solid #ffffff14;padding-top:14px;gap:10px}
.uc{display:flex;align-items:center;gap:10px}.uc b{display:block;font-size:13px;color:#fff}.uc small{color:#7f93ad;font-size:11px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));color:var(--onpri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.usr button{border-radius:10px;padding:8px}.usr button:hover{background:#ffffff24}
main{max-width:1200px;padding:28px 28px 48px}
h2{font-size:24px;font-weight:700;margin:0 0 18px;display:flex;align-items:center;gap:8px}
button{transition:filter .15s,transform .1s,background .15s;font-weight:600}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}
button.p{box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 28%,transparent)}
.c,.n{border-radius:var(--rad)}
.n{background:var(--card);border:1px solid var(--br);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.n>b:first-child{display:block;font-size:15px;margin-bottom:6px}
.g .c{transition:transform .15s}.g .c:hover{transform:translateY(-2px)}
.w{border:1px solid var(--br);border-radius:var(--rad);overflow:auto;background:var(--card);margin-bottom:14px}
.w table{width:100%;border-collapse:collapse}
.w th{background:var(--card2);color:var(--mut);font-size:12px;font-weight:700;text-align:start;padding:11px 12px;white-space:nowrap;position:sticky;top:0}
.w td{padding:11px 12px;border-top:1px solid var(--br);vertical-align:middle}
.w tr:hover td{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.w td button{margin:2px;padding:6px 10px;font-size:13px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m{backdrop-filter:blur(4px)}.m form{border:1px solid var(--br);box-shadow:0 24px 60px #0008}
.mnu{display:none;position:fixed;top:10px;inset-inline-start:10px;z-index:1100;padding:8px 12px;font-size:18px}
@media(max-width:860px){.mnu{display:block}aside{position:fixed;inset-block:0;inset-inline-start:-270px;width:250px;transition:inset-inline-start .2s;box-shadow:0 0 40px #000a}aside.open{inset-inline-start:0}main{padding:60px 14px 40px}}

/* ===== [UPDATE] Full-width top navigation ===== */
.shell{flex-direction:column}.content{width:100%}

/* ===== [UPDATE] Unified compact design system (tokens + shared components) ===== */
:root{--fs:13px;--fs-s:12px;--fs-l:15px;--ctl:30px;--rad:10px;--gap:8px;--pad:10px}
html,body{max-width:100%}body{font-size:var(--fs);line-height:1.45;overflow-x:hidden}
aside{padding:6px 16px;gap:12px;min-width:0}
.brand{font-size:16px}.brand small{font-size:11px}

aside nav button .ic{width:24px;height:24px;font-size:13px;border-radius:7px}
aside nav button.on::before{bottom:-7px;height:2px}
.bd{font-size:10px;padding:0 6px}
.av{width:28px;height:28px;font-size:13px}.uc b{font-size:var(--fs)}
.gear{width:28px;height:28px;font-size:14px}.usr button{padding:5px 10px;border-radius:8px}
main{padding:14px 18px 32px;max-width:1700px;margin:0 auto}
h2{font-size:18px;margin:0 0 10px}
button{padding:5px 12px;font-size:var(--fs);min-height:var(--ctl);border-radius:8px}
input,select,textarea{padding:5px 9px;font-size:var(--fs);min-height:var(--ctl);border-radius:8px}
textarea{min-height:60px}input[type=checkbox],input[type=radio]{min-height:0}
label{font-size:var(--fs-s);margin:8px 0 3px}
.r{gap:6px;margin-top:8px}
.g{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.c{padding:10px 12px;border-radius:12px}.g .c{border-top-width:3px}
.c h3{font-size:22px;margin:0 0 2px}.c span{font-size:var(--fs-s)}
.n{padding:10px 12px;margin-bottom:8px;font-size:var(--fs);border-radius:12px}
.n>b:first-child{font-size:14px;margin-bottom:4px}.mut{font-size:var(--fs-s)}
.w{margin-bottom:10px;border-radius:12px;max-width:100%}
th,td{padding:6px 10px;line-height:1.35}
th{font-size:11.5px}.w th{padding:7px 10px}.w td{padding:6px 10px}
.w td button,td button{padding:2px 8px;min-height:24px;font-size:var(--fs-s);margin:1px}
.t{padding:2px 8px;font-size:11px}
.m form{max-width:420px;padding:14px;border-radius:14px;font-size:var(--fs)}.m form h3{margin:0 0 6px;font-size:16px}
#dd{min-width:180px;padding:4px}#dd button{padding:6px 10px;font-size:var(--fs);min-height:0}#dd .ic{width:24px;height:24px}
#toast{padding:8px 14px;font-size:var(--fs)}

<script>
// ---------- الحالة ----------
const LS=localStorage, $=s=>document.querySelector(s);
if(!LS.aff_theme)LS.aff_theme='cyber-track';
// ======== [UPDATE] i18n / themes / provider ========
let LANG=LS.aff_lang==='en'?'en':'ar', LOCALE=LANG==='en'?'en-GB':'ar-EG';
const T=(a,e)=>LANG==='en'?e:a;
const TR={'لوحة التحكم':'Dashboard','الخريطة':'Map','الشركات والزيارات':'Companies & Visits','المركبات':'Vehicles','السائقون':'Drivers','الأجهزة':'Devices','التنبيهات':'Alerts','تقارير المتتبعين':'Tracker Reports','تتبّع موقعي':'Track My Location','المستخدمون':'Users','الإعدادات':'Settings','الإعدادات وقاعدة البيانات':'Settings & Database','تتبع المركبات':'Vehicle Tracking','خروج':'Logout','تسجيل الدخول':'Sign in','إنشاء حساب جديد':'Create account','البريد الإلكتروني':'Email','كلمة المرور':'Password','الاسم':'Name','الصلاحية':'Role','حفظ':'Save','إلغاء':'Cancel','حذف':'Delete','تعديل':'Edit','نعم':'Yes','لا':'No','بحث':'Search','+ إضافة':'+ Add','إضافة':'Add','الحالة':'Status','متصل':'Online','غير متصل':'Offline','متوقف':'Stopped','يتحرك':'Moving','السرعة':'Speed','البطارية':'Battery','آخر تحديث':'Last update','السائق':'Driver','المركبة':'Vehicle','المتتبع':'Tracker','التاريخ':'Date','اليوم':'Today','الوقت':'Time','المسافة':'Distance','الكيلومترات':'Kilometers','كم/س':'km/h','كم':'km','ملاحظات':'Notes','الشركات':'Companies','من تاريخ':'From date','إلى تاريخ':'To date','عرض التقرير':'Show report','تصدير Excel':'Export Excel','تصدير CSV':'Export CSV','تصدير PDF':'Export PDF','لا توجد بيانات':'No data','لا توجد تنبيهات':'No alerts','لا يوجد متتبعون':'No trackers','جاري الاتصال بقاعدة البيانات…':'Connecting to database…','إعادة المحاولة':'Retry','تم الحفظ':'Saved','فشل الحفظ':'Save failed','فشل الاتصال بقاعدة البيانات':'Database connection failed','نسخة احتياطية واسترجاع':'Backup & Restore','تصدير نسخة البيانات':'Export data backup','استرجاع من ملف':'Restore from file','حد السرعة للتنبيه':'Speed alert limit','تسجيل الزيارات تلقائيًا':'Automatic visit logging','تفعيل التسجيل التلقائي':'Enable automatic logging','تصفير بيانات محددة':'Reset selected data','تنفيذ التصفير':'Run reset','كل المركبات':'All vehicles','كل السائقين':'All drivers','كل الأجهزة':'All devices','كل المتتبعين':'All trackers','المواقع الحالية للأجهزة':'Current device positions','مدير عام (Super Admin)':'Super Admin','مدير (Manager)':'Manager','مشاهد (Viewer)':'Viewer','متتبع (موبايل)':'Tracker (mobile)','الخريطة المباشرة':'Live Map','عرض الكل':'Show all','مسارات اليوم':'Today routes','فتح في Google Maps':'Open in Google Maps','الشركات المحفوظة وخطوط السير':'Saved companies & routes','مواقع الشركات المحفوظة':'Saved company locations','حفظ الموقع':'Save location','جاري البحث…':'Searching…','عنوان غير معروف':'Unknown address','زمن الحركة':'Moving time','زمن التوقف':'Stopped time','أقصى سرعة':'Max speed','البداية':'Start','النهاية':'End','المدة':'Duration','الإنجاز':'Completion','زيارات مخططة':'Planned visits','تمت':'Done','لم تتم':'Not done','تقرير زيارات الشركات':'Company visits report','أيام التتبع':'Tracking days','أضف مركبات وأجهزة أولاً':'Add vehicles and devices first','تم حذف':'Deleted','تم إلغاء علامة إتمام الزيارة':'Visit completion cleared','تم تسجيل زيارة الشركة':'Company visit recorded','تم التصفير':'Reset done','شكل الشاحنة':'Truck shape','لون الشاحنة':'Truck color','المعرّف:':'ID:','قاعدة البيانات غير متصلة':'Database offline','المتصفح لا يدعم تحديد الموقع':'Browser does not support geolocation'};
const KEYS=Object.keys(TR).sort((a,b)=>b.length-a.length), AR=/[\u0600-\u06FF]/;
function trs(x){if(LANG!=='en'||!x||!AR.test(x))return x;const k=x.trim();if(TR[k])return x.replace(k,TR[k]);for(const q of KEYS)if(q.length>3&&x.includes(q))x=x.split(q).join(TR[q]);return x}
function trNode(n){if(n.nodeType===3){const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='STYLE'){for(const a of['placeholder','title','aria-label']){const v=n.getAttribute(a);if(v){const w=trs(v);if(w!==v)n.setAttribute(a,w)}}n.childNodes.forEach(trNode)}}
function setDocLang(){LOCALE=LANG==='en'?'en-GB':'ar-EG';const h=document.documentElement;h.lang=LANG;h.dir=LANG==='en'?'ltr':'rtl';document.title=T('AFF Fleet Tracker','AFF Fleet Tracker')}
function setLang(l){LANG=l==='en'?'en':'ar';LS.aff_lang=LANG;setDocLang();render()}
const langSel=()=>`<select onchange="setLang(this.value)"><option value="ar" ${LANG==='ar'?'selected':''}>العربية</option><option value="en" ${LANG==='en'?'selected':''}>English</option></select>`;

const mk=(bg,card,card2,tx,mut,br,pri,pri2,side,sec,acc,onpri,dark)=>({d:dark,v:{bg,card,card2,tx,mut,br,pri,pri2,side,sec,acc,onpri}});
const PRESETS={
 cyber:{n:['Cyber Track (الافتراضي)','Cyber Track (default)'],...mk('#070b14','#0d1524','#101c2e','#e8f4ff','#8ba4bf','#1d3553','#00c8ff','#007ca8','#050914','#6366f1','#00c8ff','#03111b',1)},
 corp:{n:['AFF أزرق مؤسسي','AFF Corporate Blue'],...mk('#0a1424','#11213a','#152a49','#eaf2ff','#8fa6c4','#223e66','#2f80ed','#1b4fa8','#07101e','#6aa9ff','#2f80ed','#ffffff',1)},
 dblue:{n:['أزرق داكن','Dark Blue'],...mk('#060d1f','#0b1733','#0f1f45','#e6ecff','#8d9cc4','#1b2d5e','#4f7cff','#2a47c4','#040a18','#8b5cf6','#4f7cff','#ffffff',1)},
 light:{n:['فاتح','Light'],...mk('#f2f5fa','#ffffff','#f8fafd','#14243b','#5b6f8a','#d3dce9','#1565d8','#0d47a1','#0f2747','#7c5cff','#1565d8','#ffffff',0)},
 dark:{n:['داكن','Dark'],...mk('#0f0f10','#19191b','#1f1f22','#f1f1f2','#9a9aa3','#2e2e33','#e5e7eb','#9ca3af','#0a0a0b','#f59e0b','#e5e7eb','#111111',1)},
 green:{n:['أخضر','Green'],...mk('#07130e','#0d2018','#102a1f','#e8fff3','#8cb8a2','#1c4636','#22c55e','#15803d','#050e0a','#84cc16','#22c55e','#04210f',1)},
 purple:{n:['بنفسجي','Purple'],...mk('#0d0816','#170f26','#1d1330','#f3ebff','#a893c8','#35224f','#a855f7','#6d28d9','#09050f','#ec4899','#a855f7','#ffffff',1)}};
let thDraft=null;
const thKey=()=>'aff_th_'+(typeof me!=='undefined'&&me?me.id:'guest');
const thLoad=()=>{try{const c=JSON.parse(LS[thKey()]||LS.aff_th_last||'null');if(c&&PRESETS[c.p])return c}catch(e){}return{p:'cyber',c:{}}};
function applyVars(cfg){const P0=PRESETS[cfg.p]||PRESETS.cyber,v={...P0.v,...(cfg.c||{})};if(cfg.c&&cfg.c.pri&&!cfg.c.pri2)v.pri2=`color-mix(in srgb,${v.pri} 60%,#000)`;
 v.glow=`0 0 0 1px color-mix(in srgb,${v.pri} 10%,transparent),0 0 18px color-mix(in srgb,${v.pri} 5%,transparent)`;v.sh=`0 4px 22px color-mix(in srgb,${v.pri} 7%,transparent)`;
 const st=document.documentElement.style;for(const k in v)st.setProperty('--'+k,v[k]);st.colorScheme=P0.d?'dark':'light'}
const applyTheme=()=>applyVars(thDraft||thLoad());
function thPick(id){thDraft={p:id,c:{}};applyTheme();render()}
function thColor(k,v){thDraft=thDraft||thLoad();thDraft.c={...(thDraft.c||{}),[k]:v};applyTheme()}
function thApply(){const c=thDraft||thLoad();LS[thKey()]=LS.aff_th_last=JSON.stringify(c);thDraft=null;toast(T('تم تطبيق المظهر','Theme applied'));render()}
function thCancel(){thDraft=null;applyTheme();render()}
function thReset(){thDraft=null;LS[thKey()]=LS.aff_th_last=JSON.stringify({p:'cyber',c:{}});applyTheme();toast(T('تمت إعادة الضبط','Reset to default'));render()}
function appearanceUI(){const c=thDraft||thLoad(),v={...PRESETS[c.p].v,...(c.c||{})},hx=x=>/^#[0-9a-f]{6}$/i.test(x)?x:'#000000';
 return `<div class="n"><b>${T('المظهر والثيمات','Appearance & Themes')}</b>
 <p class="mut">${T('اختر ثيمًا جاهزًا أو خصّص الألوان؛ التغيير يظهر فورًا كمعاينة ولا يُحفظ إلا بعد «تطبيق». يُحفظ المظهر لكل مستخدم على هذا الجهاز.','Pick a preset or customize colors. Changes preview instantly and are saved only when you press Apply. Saved per user on this device.')}</p>
 <div class="thg">${Object.keys(PRESETS).map(k=>{const p=PRESETS[k].v;return `<button class="thb ${c.p===k?'on':''}" onclick="thPick('${k}')"><i><b style="background:${p.bg}"></b><b style="background:${p.pri}"></b><b style="background:${p.sec}"></b></i>${PRESETS[k].n[LANG==='en'?1:0]}</button>`}).join('')}</div>
 <div class="thc"><div><label>${T('اللون الأساسي','Primary color')}</label><input type="color" value="${hx(v.pri)}" oninput="thColor('pri',this.value)"></div><div><label>${T('اللون الثانوي','Secondary color')}</label><input type="color" value="${hx(v.sec)}" oninput="thColor('sec',this.value)"></div><div><label>${T('لون التمييز','Accent color')}</label><input type="color" value="${hx(v.acc)}" oninput="thColor('acc',this.value)"></div></div>
 <div class="r" style="margin-top:10px"><button class="p" onclick="thApply()">${T('تطبيق','Apply')}</button><button onclick="thCancel()">${T('إلغاء المعاينة','Cancel preview')}</button><button class="d" onclick="thReset()">${T('إعادة للافتراضي','Reset to default')}</button></div></div>
 <div class="n"><b>${T('اللغة','Language')}</b><div style="margin-top:8px">${langSel()}</div></div>`}

// ---- connection provider (Firebase is the untouched default) ----
const PV0=()=>({type:'firebase',sb:{url:'',key:'',table:'aff_store'},vps:{url:'',token:''}});
const provider=()=>{try{const o=JSON.parse(LS.aff_provider||'{}');return{...PV0(),...o,sb:{...PV0().sb,...o.sb},vps:{...PV0().vps,...o.vps}}}catch(e){return PV0()}};
async function extFetch(p=provider()){
 if(p.type==='supabase'){const r=await fetch(`${p.sb.url.replace(/\/$/,'')}/rest/v1/${p.sb.table}?id=eq.db&select=json`,{headers:{apikey:p.sb.key,Authorization:'Bearer '+p.sb.key}});if(!r.ok)throw Error('Supabase '+r.status);const a=await r.json();return a[0]?a[0].json:null}
 const r=await fetch(p.vps.url.replace(/\/$/,'')+'/db',{headers:p.vps.token?{Authorization:'Bearer '+p.vps.token}:{}});if(r.status===404)return null;if(!r.ok)throw Error('Server '+r.status);const j=await r.json();return j.json||null}
async function extSave(j,p=provider()){
 if(p.type==='supabase'){const r=await fetch(`${p.sb.url.replace(/\/$/,'')}/rest/v1/${p.sb.table}`,{method:'POST',headers:{apikey:p.sb.key,Authorization:'Bearer '+p.sb.key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:'db',json:j})});if(!r.ok)throw Error('Supabase '+r.status);return}
 const r=await fetch(p.vps.url.replace(/\/$/,'')+'/db',{method:'PUT',headers:{'Content-Type':'application/json',...(p.vps.token?{Authorization:'Bearer '+p.vps.token}:{})},body:JSON.stringify({json:j})});if(!r.ok)throw Error('Server '+r.status)}
let pvD=null;
const pvGet=()=>pvD||(pvD=provider());
function pvRead(){const p=pvGet(),g=i=>(document.getElementById(i)||{}).value;if(document.getElementById('pv_sbu')){p.sb={url:(g('pv_sbu')||'').trim(),key:(g('pv_sbk')||'').trim(),table:(g('pv_sbt')||'aff_store').trim()};p.vps={url:(g('pv_vu')||'').trim(),token:(g('pv_vt')||'').trim()}}return p}
function pvType(t){pvRead();pvGet().type=t;render()}
async function pvTest(){const p=pvRead();if(p.type==='firebase'){toast(fbOnline?T('Firebase متصل','Firebase connected'):T('Firebase غير متصل','Firebase offline'));return}
 try{await extFetch(p);toast(T('نجح الاتصال ✔','Connection OK ✔'))}catch(e){toast(T('فشل الاتصال: ','Connection failed: ')+e.message)}}
async function pvCopy(){const p=pvRead();if(p.type==='firebase')return toast(T('اختر Supabase أو الخادم أولًا','Choose Supabase or Server first'));
 if(!confirm(T('سيتم نسخ البيانات الحالية إلى المزوّد المحدد (استبدال ما فيه). Firebase لن يتغير. متابعة؟','Current data will be copied to the selected provider (overwriting it). Firebase is not modified. Continue?')))return;
 try{await extSave(dbJson(),p);toast(T('تم نسخ البيانات','Data copied'))}catch(e){toast(T('فشل النسخ: ','Copy failed: ')+e.message)}}
function pvApply(){const p=pvRead();LS.aff_provider=JSON.stringify(p);toast(T('تم الحفظ، جاري إعادة التحميل…','Saved, reloading…'));setTimeout(()=>location.reload(),700)}
function dbPage(){const p=pvGet(),r=(t,n)=>`<label><input type="radio" name="pv" ${p.type===t?'checked':''} onchange="pvType('${t}')"> ${n}</label>`;
 return `<h2>${T('إعدادات قاعدة البيانات والخادم','Database & Server Settings')}</h2>
 <div class="n"><b>${T('مزوّد الاتصال','Connection provider')}</b><div class="pvr">${r('firebase','Firebase Realtime Database ('+T('الحالي','existing')+')')}${r('supabase','Supabase')}${r('vps',T('خادم خاص / VPS','Self-Hosted Server / VPS'))}</div>
 <p class="mut">${T('Firebase محمي: لا يتم تعديل إعداداته أو بياناته من هذه الصفحة. عند اختيار مزوّد آخر تُحفظ بيانات التطبيق الرئيسية فيه فقط، بينما تظل مواقع GPS اللحظية والزيارات على Firebase.','Firebase is protected: its config and data are never modified here. With another provider, the main app data is saved there only; live GPS positions and visits stay on Firebase.')}</p></div>
 ${p.type==='firebase'?`<div class="n"><b>Firebase</b><p class="mut">${T('المشروع','Project')}: ${esc(FB_CFG.projectId)} — ${fbOnline?'🟢 '+T('متصل','Online'):'🔴 '+T('غير متصل','Offline')}</p></div>`:''}
 ${p.type==='supabase'?`<div class="n"><label>Project URL</label><input id="pv_sbu" dir="ltr" value="${esc(p.sb.url)}" placeholder="https://xxxx.supabase.co"><label>anon / service key</label><input id="pv_sbk" dir="ltr" type="password" value="${esc(p.sb.key)}"><label>${T('اسم الجدول','Table name')}</label><input id="pv_sbt" dir="ltr" value="${esc(p.sb.table)}"><p class="mut">${T('أنشئ الجدول بهذا الأمر ثم فعّل سياسات الوصول (RLS) المناسبة:','Create the table, then add suitable RLS policies:')}</p><pre class="cd">create table aff_store(id text primary key, json text);</pre></div>`:''}
 ${p.type==='vps'?`<div class="n"><label>${T('رابط الخادم','Server URL')}</label><input id="pv_vu" dir="ltr" value="${esc(p.vps.url)}" placeholder="https://fleet.example.com/api"><label>Bearer token (${T('اختياري','optional')})</label><input id="pv_vt" dir="ltr" type="password" value="${esc(p.vps.token)}"><p class="mut">${T('يتوقع التطبيق:','The app expects:')}</p><pre class="cd">GET  {url}/db  -> {"json":"..."}  (404 if empty)\nPUT  {url}/db  body {"json":"..."}</pre></div>`:''}
 <div class="r"><button onclick="pvTest()">${T('اختبار الاتصال','Test connection')}</button>${p.type!=='firebase'?`<button onclick="pvCopy()">${T('نسخ البيانات الحالية إلى هذا المزوّد','Copy current data to this provider')}</button>`:''}<button class="p" onclick="pvApply()">${T('حفظ وتطبيق','Save & apply')}</button></div>
 <p class="mut">${T('تُحفظ مفاتيح الاتصال في متصفح هذا الجهاز فقط.','Connection keys are stored in this device\'s browser only.')}</p>`}
function postRender(){if(me&&me.role!=='tracker'&&me.role!=='viewer'&&typeof dbReady!=='undefined'&&dbReady)evalMaint();const e=document.getElementById('lgsw');if(e){e.style.display=me?'none':'block';e.innerHTML=langSel()}if(LANG==='en')trNode(document.body)}

const empty=()=>({users:[],vehicles:[],drivers:[],devices:[],companies:[],dailyPlans:[],positions:{}});
let db=Object.assign(empty(),JSON.parse(LS.aff_db||'{}'));
db.companies=Array.isArray(db.companies)?db.companies:[];db.dailyPlans=Array.isArray(db.dailyPlans)?db.dailyPlans:[];
let me=JSON.parse(sessionStorage.aff_me||'null'), page='dash', map, layer, fitted=false;
let noMerge=false,liveT={},manualStop=false,routeEditingId=null,companyPickerMap=null,companyPickMarker=null,driverRouteMap=null,driverRouteLayer=null,driverRouteFitted=false,trackerCurrentPoint=null;
const normalizeDB=o=>{const x=Object.assign(empty(),o||{});x.companies=Array.isArray(x.companies)?x.companies:[];x.dailyPlans=Array.isArray(x.dailyPlans)?x.dailyPlans:[];x.users=Array.isArray(x.users)?x.users:[];x.vehicles=Array.isArray(x.vehicles)?x.vehicles:[];x.drivers=Array.isArray(x.drivers)?x.drivers:[];x.devices=Array.isArray(x.devices)?x.devices:[];x.positions=x.positions&&typeof x.positions==='object'?x.positions:{};return x};
function uid(){return(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'')}

const OFFLINE_MS=10*60*1000;
function posOf(v){const d=db.devices.find(d=>d.vehicleId===v.id);return d?{d,p:db.positions[d.id]}:{}}
function status(v){
  const {d,p}=posOf(v);
  if(!d)return['بدون جهاز','#6b7686'];if(!p)return['لا توجد بيانات','#6b7686'];
  if(Date.now()-p.t>OFFLINE_MS)return['غير متصل','#d93b3b'];
  return(p.speed_mps||0)>1?['يتحرك','#1a9d55']:['متوقف','#d98a00'];
}
function alerts(){return alertsBase().concat(mtAlerts())}
function alertsBase(){
  const a=[];
  db.vehicles.forEach(v=>{const {d,p}=posOf(v);if(!d||!p)return;
    if(Date.now()-p.t>OFFLINE_MS)a.push(['critical',`المركبة ${v.name||v.plate} غير متصلة منذ ${Math.round((Date.now()-p.t)/60000)} دقيقة`]);
    if(p.battery!=null&&p.battery<15)a.push(['warning',`بطارية جهاز ${v.name||v.plate} منخفضة (${p.battery}%)`]);
    if((p.speed_mps||0)*3.6>(db.maxSpeed||120))a.push(['warning',`${v.name||v.plate} تجاوزت السرعة (${Math.round(p.speed_mps*3.6)} كم/س)`]);
  });

  return a;
}

  return `https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lng}&destination=${l.lat},${l.lng}&travelmode=driving`+(w.length?`&waypoints=${w.join('%7C')}`:'')}

function parseMapInput(s){
  s=String(s||'').trim();let m;
  const ok=(a,b)=>{a=Number(a);b=Number(b);return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null};
  try{s=decodeURIComponent(s)}catch(e){}
  if(m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/))return ok(m[1],m[2]);
  if(m=s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/))return ok(m[1],m[2]);
  if(m=s.match(/[?&](?:q|ll|query|destination|center)=\+?(-?\d+(?:\.\d+)?)[, ]+(-?\d+(?:\.\d+)?)/))return ok(m[1],m[2]);

  plan.completedIds=plan.completedIds||[];
  const man=plan.completedIds.includes(companyId),rec=visitRec(plan.date,plan.userId,companyId),done=man||!!rec;
  let changed=false;
  if(done){
    if(man){plan.completedIds=plan.completedIds.filter(id=>id!==companyId);changed=true}
    /* إلغاء زيارة سجّلها النظام تلقائيًا: نعلّم السجل «ملغي» بدل حذفه حتى لا يُسجَّل من جديد */
    if(rec){rec.cancelled=1;R(`visits/${plan.date}/${plan.userId}/${companyId}`).update({cancelled:1}).catch(()=>{})}

  try{
    const rm=await fetchRemote();
    db=rm?Object.assign(normalizeDB(rm),{positions:{}}):empty();
    // تأكيد حساب بيتر سيدهم كمدير عام بالحساب وكلمة المرور اللذين طلبهما المستخدم.
    const email='psaidhome@af-f.com', salt='aff-initial-admin-v1-r4nd0m-SALT';
    const hashValue='cf119d28c15e8bc3051d74888f12863ce72e7e89b341788e0f216c3bb33635f9';
    let admin=db.users.find(u=>(u.email||'').toLowerCase()===email), changed=false;
    if(!admin){admin={id:uid(),name:'بيتر سيدهم',email,salt,hash:hashValue,role:'super_admin'};db.users.push(admin);changed=true}
    else if(admin.name!=='بيتر سيدهم'||admin.role!=='super_admin'||admin.salt!==salt||admin.hash!==hashValue){Object.assign(admin,{name:'بيتر سيدهم',email,salt,hash:hashValue,role:'super_admin'});changed=true}

function dl(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

async function expFull(){
  if(!fb)return toast('قاعدة البيانات غير متصلة');
  const f=$('#bk_f').value,t=$('#bk_t').value;
  if(!f||!t||f>t)return toast('اختر فترة صحيحة (من ≤ إلى)');
  if((new Date(t)-new Date(f))/864e5>92)return toast('الحد الأقصى للنسخة الواحدة 93 يومًا');
  const btn=$('#bkFull'),old=btn.textContent;btn.disabled=true;
  try{
    const tracks={},trs=db.users.filter(u=>u.role==='tracker');let n=0;
    for(let i=0;i<trs.length;i++){
      btn.textContent=`جاري تحميل المسارات… ${i+1}/${trs.length}`;
      const sn=await R('tracks/'+trs[i].id).orderByKey().startAt(f).endAt(t).get();
      if(sn.exists()){tracks[trs[i].id]=sn.val();n+=Object.keys(sn.val()).length}
    }
    dl(JSON.stringify({format:'aff-full-backup',version:1,exportedAt:new Date().toISOString(),range:{from:f,to:t},db:{...db,positions:{}},tracks}),`aff-full-backup-${f}_${t}.json`);
    toast(`تم تصدير النسخة الكاملة (${n} يوم مسار)`);
  }catch(e){toast('فشل التصدير: '+e.message)}
  finally{btn.disabled=false;btn.textContent=old}
}
async function imp(f){
  if(!f)return;const inp=$('#imp');
  let o;try{o=JSON.parse(await f.text())}catch(e){if(inp)inp.value='';return toast('ملف غير صالح')}
  const full=!!(o&&o.format==='aff-full-backup'),d=full?o.db:o;
  if(!d||typeof d!=='object'||!Array.isArray(d.users)||!d.users.length){if(inp)inp.value='';return toast('الملف لا يبدو نسخة احتياطية صحيحة (لا يحتوي على مستخدمين)')}
  const cn=x=>Array.isArray(x)?x.length:0,nd=Object.values((full&&o.tracks)||{}).reduce((a,v)=>a+Object.keys(v||{}).length,0);
  if(!confirm(`استرجاع هذه النسخة سيستبدل البيانات الحالية بالكامل.\n\nمحتوى النسخة: ${cn(d.users)} مستخدم، ${cn(d.vehicles)} مركبة، ${cn(d.drivers)} سائق، ${cn(d.companies)} شركة، ${cn(d.dailyPlans)} خطة`+(full?`، و${nd} يوم مسار`:'')+`\n\nسيتم تنزيل نسخة من البيانات الحالية تلقائيًا قبل الاستبدال. متابعة؟`)){if(inp)inp.value='';return}
  exp();
  try{
    db=normalizeDB(d);await save();
    if(full&&fb&&o.tracks){let k=0;for(const u of Object.keys(o.tracks))for(const [dy,v] of Object.entries(o.tracks[u]||{})){await R(`tracks/${u}/${dy}`).set(v);k++;toast(`استرجاع المسارات… ${k}/${nd}`)}}
    toast('تم الاسترجاع');
  }catch(e){toast('فشل الاسترجاع: '+e.message)}
  if(inp)inp.value='';render();
}

async function auth(ev){
  ev.preventDefault();if(!dbReady)return toast('قاعدة البيانات غير متصلة بعد');
  const f=Object.fromEntries(new FormData(ev.target)),email=f.email.trim().toLowerCase();
  try{
    const rm=await fetchRemote();if(rm)applyRemote(rm);
    if(authMode==='register'){
      if(db.users.some(u=>(u.email||'').toLowerCase()===email))return toast('هذا البريد الإلكتروني مسجل بالفعل');
      const salt=uid()+uid(),nu={id:uid(),name:f.name.trim(),email,salt,hash:await hash(f.pw,salt),role:'tracker'};
      db.users.push(nu);await save();me={email,name:nu.name,role:nu.role,id:nu.id};
    }else{
      const u=db.users.find(u=>(u.email||'').toLowerCase()===email);
      if(!u||u.hash!==await hash(f.pw,u.salt))return toast('بيانات الدخول غير صحيحة');
      me={email,name:u.name,role:u.role,id:u.id};
    }
  }catch(e){return toast('خطأ في الاتصال أو المصادقة: '+e.message)}
  sessionStorage.aff_me=JSON.stringify(me);manualStop=false;if(me.role!=='tracker')startLiveSync();page=homePage();render();

let rm,rpts=[];
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const GAP_MS=15*60*1000; /* انقطاع الإشارة: فجوة أكبر من 15 دقيقة بين نقطتين */
function analyze(p){
  let dist=0,max=0,stops=[],i=0;
  for(let k=1;k<p.length;k++){const d=hav(p[k-1],p[k]);if(d>15)dist+=d}
  p.forEach(x=>{if(x.s!=null&&x.s>max)max=x.s});
  while(i<p.length){let j=i;while(j+1<p.length&&hav(p[i],p[j+1])<50)j++;if(p[j].t-p[i].t>=300000)stops.push({a:p[i],b:p[j]});i=j+1}
  /* زمن الحركة/التوقف/بدون إشارة: كل فترة بين نقطتين متتاليتين تُصنَّف حسب السرعة الفعلية */
  let mov=0,stp=0,gap=0,movd=0;
  for(let k=1;k<p.length;k++){const dt=p[k].t-p[k-1].t;if(dt<=0)continue;if(dt>GAP_MS){gap+=dt;continue}const d=hav(p[k-1],p[k]);if(d>15&&d/(dt/1000)>=1){mov+=dt;movd+=d}else stp+=dt}
  return{dist,max,stops,mov,stp,gap,movd};
}

async function popAddr(e,p){const x=e.popup.getElement()?.querySelector('.pa2');if(!x)return;try{x.textContent='🛣️ '+fmtAddr(await addr(p.lat,p.lng),'road')}catch(err){x.textContent='تعذّر جلب العنوان'}}

const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
/* نطاق الشركة بالمتر: قابل للتعديل من الإعدادات (الافتراضي 200). أي نقطة داخل هذه الدائرة تُحسب "داخل الشركة" */
function nearCompany(p){
  const rad=cRad();let best=null,bd=Infinity;
  (db.companies||[]).forEach(c=>{const la=Number(c.lat),lo=Number(c.lng);if(c.lat===''||c.lng===''||!Number.isFinite(la)||!Number.isFinite(lo))return;if(Math.abs(p.lat-la)>0.03||Math.abs(p.lng-lo)>0.03)return;const d=hav(p,{lat:la,lng:lo});if(d<bd){bd=d;best=c}});
  return bd<=rad?best:null;
}
/* يجهّز أسطر التقرير: كل توقف (نقاط متقاربة أقل من 50م) سطر واحد فيه وقت الانتظار + اسم المنطقة أو الشركة */
async function buildRows(prog){
  const wt=ms=>new Promise(r=>setTimeout(r,ms)),rows=[],inCo=rpts.map(nearCompany);let i=0;
  while(i<rpts.length){
    let j=i;
    if(inCo[i]){while(j+1<rpts.length&&inCo[j+1]&&inCo[j+1].id===inCo[i].id)j++}
    else{while(j+1<rpts.length&&!inCo[j+1]&&hav(rpts[i],rpts[j+1])<50)j++}
    const sp=rpts.slice(i,j+1).filter(x=>x.s!=null).map(x=>x.s);
    rows.push({p:rpts[i],wait:rpts[j].t-rpts[i].t,spd:sp.length?Math.round(sp.reduce((a,b)=>a+b,0)/sp.length*3.6):'',c:inCo[i]});
    i=j+1;
  }
  const anchors=[];
  for(let k=0;k<rows.length;k++){
    const r=rows[k];prog&&prog(k+1,rows.length);
    if(r.c){r.place='داخل نطاق: '+r.c.name;r.co=true;continue}
    const rad=r.wait>=60000?40:250,an=anchors.find(x=>hav(x.p,r.p)<rad);
    if(an){r.place=an.name;continue}
    const cached=!!AC[ak(r.p.lat,r.p.lng)];let name='';
    for(let t=0;t<2&&!name;t++){try{name=fmtAddr(await addr(r.p.lat,r.p.lng),'road')}catch(e){await wt(3000)}}
    name=name||'تعذّر تحديد المنطقة';
    anchors.push({p:r.p,name});r.place=name;
    if(!cached)await wt(1100);
  }
  return rows;
}

// ---------- إعادة تشغيل الرحلة (Replay) ----------
const avgKmh=a=>a.mov>0?Math.round(a.movd/(a.mov/1000)*3.6):0;
let rpl=null;
function stopReplay(){if(rpl&&rpl.raf)cancelAnimationFrame(rpl.raf);rpl=null}
function initReplay(){
  stopReplay();if(!rm||rpts.length<2)return;
  const u=db.users.find(x=>x.id===$('#ru').value)||{};
  const mk=L.marker([rpts[0].lat,rpts[0].lng],{icon:L.divIcon({className:'aff-truck-div',html:`<div class="aff-truck-marker">${truckSvg(avatarTypeOf(u),avatarColorOf(u))}</div>`,iconSize:[48,42],iconAnchor:[24,21]}),zIndexOffset:1000}).addTo(rm);
  const done=L.polyline([],{weight:6,color:'#00e58b',opacity:.95}).addTo(rm);
  rpl={pts:rpts,t0:rpts[0].t,t1:rpts[rpts.length-1].t,vt:rpts[0].t,speed:+($('#rplSp')?.value||300),playing:false,raf:0,last:0,mk,done,idx:-1,lt:0};
  rplDraw(true);rplBtn();
}
function rplAt(vt){
  const p=rpl.pts;let lo=0,hi=p.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(p[m].t<=vt)lo=m;else hi=m}
  const a=p[lo],b=p[hi],f=b.t>a.t?Math.min(1,Math.max(0,(vt-a.t)/(b.t-a.t))):0;
  return{i:lo,lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f,gap:b.t-a.t>GAP_MS}
}
function rplDraw(force){
  if(!rpl)return;const c=rplAt(rpl.vt),now=performance.now();
  rpl.mk.setLatLng([c.lat,c.lng]);
  if(force||(c.i!==rpl.idx&&now-rpl.lt>90)){rpl.idx=c.i;rpl.lt=now;const tr=rpl.pts.slice(0,c.i+1).map(x=>[x.lat,x.lng]);tr.push([c.lat,c.lng]);rpl.done.setLatLngs(tr)}
  if(rm&&!rm.getBounds().contains([c.lat,c.lng]))rm.panTo([c.lat,c.lng],{animate:false});
  const sl=$('#rplSl');if(sl)sl.value=Math.round((rpl.vt-rpl.t0)/Math.max(1,rpl.t1-rpl.t0)*1000);
  const inf=$('#rplInfo');if(inf){
    const sp=rpl.pts[c.i].s,co=nearCompany({lat:c.lat,lng:c.lng});
    inf.innerHTML=`<b>${new Date(rpl.vt).toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</b> · ${sp==null?'—':Math.round(sp*3.6)+' كم/س'}${co?' · 🏢 داخل نطاق: '+esc(co.name):''}${c.gap?' · <span class="warn">⚠️ لا توجد إشارة في هذه الفترة (تُسرَّع)</span>':''}`;
  }
}
function rplTick(ts){
  if(!rpl||!rpl.playing)return;
  if(!document.getElementById('rplSl')){stopReplay();return}
  if(rpl.last){const dt=Math.min(ts-rpl.last,100),c=rplAt(rpl.vt);rpl.vt+=dt*rpl.speed*(c.gap?20:1)}
  rpl.last=ts;
  if(rpl.vt>=rpl.t1){rpl.vt=rpl.t1;rpl.playing=false;rplDraw(true);rplBtn();return}
  rplDraw();rpl.raf=requestAnimationFrame(rplTick);
}
function rplBtn(){const b=$('#rplBtn');if(b&&rpl)b.textContent=rpl.playing?'⏸ إيقاف مؤقت':(rpl.vt>=rpl.t1?'↺ إعادة التشغيل':'▶ تشغيل الرحلة')}
function rplToggle(){
  if(!rpl)return;
  if(rpl.playing){rpl.playing=false;cancelAnimationFrame(rpl.raf);rpl.last=0;rplBtn();rplDraw(true);return}
  if(rpl.vt>=rpl.t1)rpl.vt=rpl.t0;
  rpl.playing=true;rpl.last=0;rplBtn();rpl.raf=requestAnimationFrame(rplTick);
}
function rplSpeed(v){if(rpl)rpl.speed=+v}
function rplSeek(v){if(!rpl)return;rpl.vt=rpl.t0+(rpl.t1-rpl.t0)*(+v/1000);rpl.last=0;rplDraw(true);rplBtn()}

// ---------- ملء الشاشة للخرائط ----------
let fsMap=null;
function fsReset(){
  document.querySelectorAll('.mapfs').forEach(e=>e.classList.remove('mapfs'));
  document.body.classList.remove('fs-on','fs-live','fs-rep');fsMap=null;
  if(document.fullscreenElement&&document.exitFullscreen)try{document.exitFullscreen().catch(()=>{})}catch(e){}
}
function exitFS(){
  const m=fsMap;fsReset();
  if(m)try{if(m._fsa){m._fsa.innerHTML='⛶';m._fsa.title='ملء الشاشة'}setTimeout(()=>m.invalidateSize(),80)}catch(e){}
}
function toggleFS(m){
  if(fsMap===m){exitFS();return}
  if(fsMap)exitFS();
  const el=m.getContainer();fsMap=m;
  el.classList.add('mapfs');document.body.classList.add('fs-on');
  document.body.classList.toggle('fs-live',el.id==='map');document.body.classList.toggle('fs-rep',el.id==='rmap');
  if(m._fsa){m._fsa.innerHTML='✕';m._fsa.title='خروج من ملء الشاشة'}
  /* على الكمبيوتر نطلب ملء شاشة المتصفح أيضًا؛ على الآيفون يكفي الوضع الداخلي */
  try{const de=document.documentElement;if(de.requestFullscreen)de.requestFullscreen().catch(()=>{})}catch(e){}
  setTimeout(()=>m.invalidateSize(),80);
}
function addFS(m){
  const C=L.Control.extend({options:{position:'topleft'},onAdd(){
    const c=L.DomUtil.create('div','leaflet-bar leaflet-control'),b=L.DomUtil.create('a','',c);
    b.href='#';b.title='ملء الشاشة';b.innerHTML='⛶';b.setAttribute('role','button');m._fsa=b;
    L.DomEvent.disableClickPropagation(c);L.DomEvent.on(b,'click',e=>{L.DomEvent.preventDefault(e);toggleFS(m)});return c}});
  new C().addTo(m);
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fsMap)exitFS()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fsMap)exitFS()});

/* الفكرة: هاتف المتتبع هو اللي بيكتشف الوصول (نطاق + مدة بقاء) ويكتب سجلًا صغيرًا في visits/<التاريخ>/<المتتبع>/<الشركة>

  if(pt.a!=null&&pt.a>100)return;                    /* دقة الموقع ضعيفة: نتجاهل هذه النقطة */
  const d=day(pt.t);

    const dist=hav(pt,{lat:Number(c.lat),lng:Number(c.lng)});
    if(dist>cfg.rad){delete geoSt[key];return}
    const g=geoSt[key]=geoSt[key]||{since:pt.t,busy:false};

}

function visitsOfDay(pts){

function visDayList(tr,d,pts){
  const list=new Map(),recs=(visitsDB&&visitsDB[d]&&visitsDB[d][tr.id])||{};

  Object.entries(recs).forEach(([cid,r])=>{const c=companyById(cid);if(!r||!c||r.cancelled||list.has(cid))return;list.set(cid,{c,first:r.t,last:r.c||r.t,dwell:Math.max(0,(r.c||r.t)-r.t),src:'auto'})});

const AC=JSON.parse(LS.aff_addr2||'{}'),ak=(a,b)=>a.toFixed(4)+','+b.toFixed(4);
// المنطقة الكبيرة (حي/منطقة + مدينة) واسم الشارع، بدل العنوان الطويل العشوائي.
const areaOf=a=>{const s=a.suburb||a.city_district||a.quarter||a.neighbourhood||a.village||a.town||a.county||a.state_district,c=a.city||a.town||a.state;return [s,c].filter((x,i,r)=>x&&r.indexOf(x)===i).join('، ')};

function fmtAddr(o,m){
  const ar=o.area||'',rd=o.road||'';
  if(m==='area')return ar||o.full||'عنوان غير معروف';
  if(m==='road')return rd?(rd+(ar?'، '+ar:'')):(ar||o.full||'عنوان غير معروف');

async function addr(a,b){

  if(!r.ok)throw Error(r.status);const j=await r.json(),ad=j.address||{};
  AC[k]={area:areaOf(ad),road:roadOf(ad)||j.name||'',full:j.display_name||''};LS.aff_addr2=JSON.stringify(AC);return AC[k];
}
